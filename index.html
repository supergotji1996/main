<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://www.huana-nbp.go.th/index/add_file/P0D284NMon35557.png">
    <title>ระบบขออนุญาตออกนอกสถานที่</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #4cc9f0;
            --success: #06d6a0;
            --warning: #ffd166;
            --danger: #ef476f;
            --dark: #2b2d42;
            --light: #f8f9fa;
            --gray: #adb5bd;
            --white: #ffffff;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --transition: all 0.3s ease;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f0f2f5;
            color: var(--dark);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: var(--white);
            min-height: 100vh;
            position: relative;
            box-shadow: var(--shadow-lg);
        }
        
        .app-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            padding: 20px;
            text-align: center;
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }
        
        .app-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 60%);
            animation: pulse 15s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.5; }
            100% { transform: scale(1); opacity: 0.3; }
        }
        
        .logo-container {
            position: relative;
            z-index: 1;
            margin-bottom: 15px;
        }
        
        .app-logo {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            padding: 10px;
            background-color: var(--white);
            box-shadow: var(--shadow-md);
        }
        
        .app-title {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
            position: relative;
            z-index: 1;
        }
        
        .app-subtitle {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
            position: relative;
            z-index: 1;
        }
        
        .app-body {
            padding: 20px;
        }
        
        .section {
            margin-bottom: 25px;
            animation: fadeIn 0.5s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .section-title {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
            color: var(--primary);
        }
        
        .section-title i {
            font-size: 20px;
            margin-right: 10px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary);
            color: var(--white);
            border-radius: 50%;
        }
        
        .section-title h3 {
            font-size: 18px;
            font-weight: 500;
            margin: 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--dark);
            font-weight: 500;
        }
        
        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e0e0e0;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-family: 'Prompt', sans-serif;
            transition: var(--transition);
            background-color: #f9f9f9;
            color: var(--dark);
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
            background-color: var(--white);
        }
        
        .form-control::placeholder {
            color: var(--gray);
        }
        
        .toggle-group {
            display: flex;
            background-color: #f0f2f5;
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-top: 8px;
        }
        
        .toggle-option {
            flex: 1;
            position: relative;
        }
        
        .toggle-input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            color: var(--dark);
            height: 100%;
        }
        
        .toggle-label i {
            font-size: 18px;
            margin-bottom: 5px;
        }
        
        .toggle-input:checked + .toggle-label {
            background-color: var(--primary);
            color: var(--white);
            box-shadow: var(--shadow-sm);
        }
        
        .toggle-input:focus + .toggle-label {
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
        }
        
        .select-wrapper {
            position: relative;
        }
        
        .select-wrapper::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            pointer-events: none;
        }
        
        select.form-control {
            appearance: none;
            padding-right: 40px;
        }
        
        .time-input-group {
            display: flex;
            gap: 10px;
        }
        
        .time-input-group .form-group {
            flex: 1;
        }
        
        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--radius-md);
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: var(--transition);
            font-family: 'Prompt', sans-serif;
            box-shadow: var(--shadow-sm);
            margin-top: 10px;
        }
        
        .btn:hover {
            background-color: var(--primary-dark);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
            backdrop-filter: blur(5px);
        }
        
        .loading-card {
            background-color: var(--white);
            padding: 30px;
            border-radius: var(--radius-lg);
            text-align: center;
            box-shadow: var(--shadow-lg);
            max-width: 80%;
            width: 300px;
            animation: scaleIn 0.3s ease-out;
        }
        
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            position: relative;
        }
        
        .loading-spinner:before,
        .loading-spinner:after {
            content: '';
            position: absolute;
            border-radius: 50%;
            animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        
        .loading-spinner:before {
            width: 100%;
            height: 100%;
            background-color: rgba(67, 97, 238, 0.6);
            animation-delay: 0.25s;
        }
        
        .loading-spinner:after {
            width: 75%;
            height: 75%;
            background-color: var(--primary);
            top: 12.5%;
            left: 12.5%;
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.33); }
            80%, 100% { opacity: 0; }
        }
        
        .loading-text {
            color: var(--dark);
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 5px;
        }
        
        .loading-subtext {
            color: var(--gray);
            font-size: 14px;
        }
        
        .app-footer {
            text-align: center;
            padding: 20px;
            color: var(--gray);
            font-size: 12px;
            border-top: 1px solid #eee;
            margin-top: 20px;
        }
        
        /* Custom Date and Time pickers */
        input[type="date"].form-control {
            position: relative;
        }
        
        input[type="date"].form-control::-webkit-calendar-picker-indicator {
            background: transparent;
            color: transparent;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
        }
        
        /* Success Animation */
        .success-animation {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            z-index: 1100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: fadeIn 0.5s;
        }
        
        .success-icon {
            width: 100px;
            height: 100px;
            background-color: var(--success);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
            animation: scaleIn 0.5s 0.2s both;
        }
        
        .success-icon i {
            color: white;
            font-size: 50px;
        }
        
        .success-text {
            font-size: 24px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 10px;
            animation: fadeInUp 0.5s 0.4s both;
        }
        
        .success-subtext {
            font-size: 16px;
            color: var(--gray);
            text-align: center;
            max-width: 80%;
            animation: fadeInUp 0.5s 0.6s both;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Floating label effect */
        .form-floating {
            position: relative;
        }
        
        .form-floating .form-control {
            height: 60px;
            padding: 20px 16px 10px;
        }
        
        .form-floating label {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            padding: 20px 16px;
            pointer-events: none;
            border: 1px solid transparent;
            transform-origin: 0 0;
            transition: opacity .1s ease-in-out, transform .1s ease-in-out;
            color: var(--gray);
        }
        
        .form-floating .form-control:focus,
        .form-floating .form-control:not(:placeholder-shown) {
            padding-top: 28px;
            padding-bottom: 8px;
        }
        
        .form-floating .form-control:focus ~ label,
        .form-floating .form-control:not(:placeholder-shown) ~ label {
            transform: scale(0.8) translateY(-10px);
            color: var(--primary);
        }
        
        /* Neumorphism effect for select elements */
        .neumorphic {
            background: #f0f2f5;
            box-shadow: 5px 5px 10px #d1d3d6, -5px -5px 10px #ffffff;
            border: none;
        }
        
        /* Responsive adjustments */
        @media (max-width: 480px) {
            .app-body {
                padding: 15px;
            }
            
            .form-control {
                padding: 12px 14px;
            }
            
            .btn {
                padding: 14px 16px;
            }
        }
    </style>

</head>

    <div class="app-container">
        <header class="app-header">

                    <div class="form-group">

    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ตั้งค่า Flatpickr สำหรับเลือกเวลา
            flatpickr("#startTimeInput", {
                enableTime: true,
                noCalendar: true,
                dateFormat: "H:i",
                time_24hr: true,
                placeholder: "เลือกเวลาเริ่มต้น"
            });
            
            flatpickr("#endTimeInput", {
                enableTime: true,
                noCalendar: true,
                dateFormat: "H:i",
                time_24hr: true,
                placeholder: "เลือกเวลาสิ้นสุด"
            });
            
            // แสดงข้อความ owner
            const message = document.getElementById('message');
            message.innerText = 'BY:Songphon_got';
            
            // จัดการการส่งฟอร์ม
            document.getElementById('permissionForm').addEventListener('submit', function(event) {
                event.preventDefault();
                
                // สร้าง FormData จากฟอร์ม
                const formData = new FormData(this);
                
                // ฟังก์ชันแปลงวันที่เป็นรูปแบบไทย
                function formatDateToThai(dateInput) {
                    const date = new Date(dateInput);
                    const months = [
                        "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
                        "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
                    ];
                    const day = date.getDate();
                    const month = months[date.getMonth()];
                    const year = date.getFullYear() + 543; // แปลงเป็นปี พ.ศ.
                    return `${day} ${month} ${year}`;
                }
                
                // จัดการข้อมูลให้เป็น JSON ที่จะส่งไปยัง Google Apps Script
                const data = {
                    name: formData.get('name'),
                    position: formData.get('position'),
                    department: formData.get('department'),
                    date: formatDateToThai(formData.get('date')),
                    destination: formData.get('destination'),
                    purpose: formData.get('purpose'),
                    startTime: formData.get('startTime'),
                    endTime: formData.get('endTime'),
                    type: formData.get('type'),
                    vehicle: formData.get('vehicle'),
                    contact: formData.get('contact'),
                    signature: formData.get('signature')
                };
                
                // Debug: แสดงข้อมูลที่เตรียมจะส่งไปในคอนโซล
                console.log("Data being sent to Google Apps Script:", data);
                
                // แสดง Loading Animation
                document.getElementById('loadingOverlay').style.display = 'flex';
                
                // URL ของ Google Apps Script
                const scripturl = 'https://script.google.com/macros/s/AKfycbwWDul3bOBRcvzkux0_V5o2uWuwdudV4JQZPjF9F5p0a53gX4Q_NTBoL5FiIB_Z0r_G9Q/exec';
                
                                // ส่งข้อมูลไปยัง Google Apps Script
                fetch(scripturl, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(data),
                    headers: {
                        'Content-Type': 'application/json',
                    }
                })
                .then(result => {
                    // ซ่อน Loading Animation
                    document.getElementById('loadingOverlay').style.display = 'none';
                    
                    // แสดง Success Animation
                    document.getElementById('successAnimation').style.display = 'flex';
                    
                    // ซ่อน Success Animation หลังจาก 3 วินาที
                    setTimeout(() => {
                        document.getElementById('successAnimation').style.display = 'none';
                        // Reset Form
                        document.getElementById('permissionForm').reset();
                    }, 3000);
                })
                .catch(error => {
                    // ซ่อน Loading Animation ในกรณี error
                    document.getElementById('loadingOverlay').style.display = 'none';
                    
                    alert('มีข้อผิดพลาดในการส่งแบบฟอร์ม: ' + error.message);
                    console.error('Error details:', error);
                });
            });
            
            // เพิ่มเอฟเฟกต์การ focus ให้กับ input fields
            const inputs = document.querySelectorAll('.form-control');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.classList.add('focused');
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.classList.remove('focused');
                });
            });
            
            // เพิ่มการตรวจสอบข้อมูลแบบ real-time
            const validateInput = (input) => {
                if (input.value.trim() === '') {
                    input.classList.add('is-invalid');
                    return false;
                } else {
                    input.classList.remove('is-invalid');
                    input.classList.add('is-valid');
                    return true;
                }
            };
            
            inputs.forEach(input => {
                input.addEventListener('input', function() {
                    validateInput(this);
                });
            });
            
            // สร้างเอฟเฟกต์ ripple เมื่อคลิกปุ่ม
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(button => {
                button.addEventListener('click', function(e) {
                    const rect = button.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const ripple = document.createElement('span');
                    ripple.style.position = 'absolute';
                    ripple.style.width = '1px';
                    ripple.style.height = '1px';
                    ripple.style.borderRadius = '50%';
                    ripple.style.transform = 'scale(0)';
                    ripple.style.backgroundColor = 'rgba(255, 255, 255, 0.7)';
                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';
                    ripple.style.animation = 'ripple 0.6s linear';
                    
                    button.style.position = 'relative';
                    button.style.overflow = 'hidden';
                    button.appendChild(ripple);
                    
                    setTimeout(() => {
                        ripple.remove();
                    }, 600);
                });
            });
            
            // เพิ่ม keyframes สำหรับ ripple effect
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes ripple {
                    to {
                        transform: scale(100);
                        opacity: 0;
                    }
                }
            `;
            document.head.appendChild(style);
            
            // เพิ่มเอฟเฟกต์เมื่อสไลด์ระหว่างส่วนต่างๆ
            const sections = document.querySelectorAll('.section');
            let currentSectionIndex = 0;

            //     `;
            //     document.querySelector('.app-body').appendChild(nav);
            // };
            
            // createNavigation();
        });
    </script>
